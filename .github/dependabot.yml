version: 2

updates:
  - package-ecosystem: docker
    directories:
      - /caddy
      - /jenkins
      - /jenkins-agent
      - /kali
      - /nfs-server
      - /pihole
      - /secrets-manager
      - /transmission
      - /workstation
    schedule:
      interval: monthly
    commit-message:
      prefix: fix(deps)
    groups:
      docker-deps:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci(deps)
    groups:
      actions-deps:
        patterns:
          - "*"

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    groups:
      pre-commit-deps:
        patterns:
          - "*"
