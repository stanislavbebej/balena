version: 2

updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: fix(deps)
    groups:
      docker-deps:
        patterns:
          - "*"

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: fix(deps)
    groups:
      docker-compose-deps:
        patterns:
          - "*"
